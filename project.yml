# XcodeGen spec for AISEE-BIN. Regenerate the .xcodeproj with:  xcodegen generate
name: AISEE-BIN
options:
  bundleIdPrefix: com.flowsxr
  deploymentTarget:
    # 17.2 is the floor of Meta's Wearables Device Access Toolkit (Ray-Ban Meta).
    iOS: "17.2"
  createIntermediateGroups: true
packages:
  # Ray-Ban Meta glasses (AISEEBIN/Glasses/MetaGlassKit). Developer preview:
  # pin exactly, and read the changelog before moving.
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "17.2"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3U4384584Z
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    # The Realtek glasses SDK (Vendor/RTK) ships device slices only. Search paths
    # are gated to iphoneos and the frameworks are excluded from simulator builds,
    # so the simulator and the test target compile against the kit's #else stubs.
    "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(SRCROOT)/Vendor/RTK"
    "SWIFT_INCLUDE_PATHS[sdk=iphoneos*]": "$(inherited) $(SRCROOT)/Vendor/RTK $(SRCROOT)/Vendor/Immersal"
    # Immersal's native plugin (Vendor/Immersal) is a device-only static
    # library; the simulator compiles ImmersalNativeStubs.c instead.
    "SWIFT_INCLUDE_PATHS[sdk=iphonesimulator*]": "$(inherited) $(SRCROOT)/Vendor/Immersal"
    "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(SRCROOT)/Vendor/Immersal"
    "OTHER_LDFLAGS[sdk=iphoneos*]": "$(inherited) -lPosePlugin -lc++"
    "EXCLUDED_SOURCE_FILE_NAMES[sdk=iphonesimulator*]":
      - RTKAIDeviceConnection.framework
      - RTKAudioConnectSDK.framework
      - RTKAudioStreaming.framework
      - RTKLEFoundation.framework
      - OpenAIRealtimeAccess.framework
      - libavcodec.framework
      - libavformat.framework
      - libavutil.framework
      - libswresample.framework
targets:
  AISEEBIN:
    type: application
    platform: iOS
    sources:
      - path: AISEEBIN
        excludes: ["Glasses/AiSeeGlassKit/README.md"]
      - path: Vendor/Immersal/ImmersalNativeStubs.c
      # Recorded clips for the fixed phrases (voice/generate.py), bundled as "clips/".
      - path: voice/clips
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Fetch Immersal plugin
        script: '"$SRCROOT/Vendor/Immersal/fetch.sh"'
        basedOnDependencyAnalysis: false
    entitlements:
      path: AISEEBIN/AISEEBIN.entitlements
      properties:
        # The glasses stream video over their own Wi-Fi hotspot, which the kit joins.
        com.apple.developer.networking.HotspotConfiguration: true
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      - framework: Vendor/RTK/RTKAIDeviceConnection.framework
        embed: true
      - framework: Vendor/RTK/RTKAudioConnectSDK.framework
        embed: true
      - framework: Vendor/RTK/RTKAudioStreaming.framework
        embed: true
      - framework: Vendor/RTK/RTKLEFoundation.framework
        embed: true
      - framework: Vendor/RTK/OpenAIRealtimeAccess.framework
        embed: true
      - framework: Vendor/RTK/libavcodec.framework
        embed: true
      - framework: Vendor/RTK/libavformat.framework
        embed: true
      - framework: Vendor/RTK/libavutil.framework
        embed: true
      - framework: Vendor/RTK/libswresample.framework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowsxr.aiseebin
        INFOPLIST_FILE: AISEEBIN/Info.plist
        SUPPORTS_MACCATALYST: false
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Must live on the target: a project-level value loses to Xcode's target default of 1,2,
        # and an iPad-capable app is rejected (90474) for being portrait-only.
        TARGETED_DEVICE_FAMILY: "1"
        "EXCLUDED_SOURCE_FILE_NAMES[sdk=iphoneos*]": ImmersalNativeStubs.c
        # Explore's proxy token (server/explore). Never committed: pass it on the
        # xcodebuild command line, like IMMERSAL_DEFAULT_TOKEN. Empty = Ask fails (401).
        EXPLORE_TOKEN: ""
        # Ray-Ban Meta: the app's id and client token from Meta's Wearables
        # Developer Center. Empty works on glasses in Developer Mode; testers
        # on a release channel need both, passed on the xcodebuild command line.
        META_APP_ID: ""
        META_CLIENT_TOKEN: ""
  NUSOpenHouse:
    # NUS Open House Guide (2026-11-10): the AISEE-BIN sources with their own
    # entry point, screens and assets, compiled with NUS_APP. No glasses SDK:
    # the RTK frameworks are not linked, so the kit compiles its stub path.
    type: application
    platform: iOS
    sources:
      - path: AISEEBIN
        excludes:
          - "Glasses/AiSeeGlassKit/README.md"
          - "AISEEBINApp.swift"
          - "Assets.xcassets"
          - "Info.plist"
          - "AISEEBIN.entitlements"
      - path: Vendor/Immersal/ImmersalNativeStubs.c
      - path: NUSOpenHouse
        excludes: ["Info.plist"]
    preBuildScripts:
      - name: Fetch Immersal plugin
        script: '"$SRCROOT/Vendor/Immersal/fetch.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowsxr.nusopenhouse
        PRODUCT_NAME: NUSOpenHouse
        INFOPLIST_FILE: NUSOpenHouse/Info.plist
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NUS_APP"
        "EXCLUDED_SOURCE_FILE_NAMES[sdk=iphoneos*]": ImmersalNativeStubs.c
        # No glasses kit: drop Vendor/RTK from the search paths the project sets.
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": ""
        "SWIFT_INCLUDE_PATHS[sdk=iphoneos*]": "$(SRCROOT)/Vendor/Immersal"
  AISEEBINTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AISEEBINTests
    dependencies:
      - target: AISEEBIN
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowsxr.aiseebin.tests
        # XcodeGen adds Vendor/RTK to the target's search path for the framework
        # dependencies above, unconditionally; on the simulator that makes
        # `canImport(RTKAIDeviceConnection)` true with no usable slice behind
        # it. The sdk-conditional setting wins, so drop the path there.
        "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited)"
        GENERATE_INFOPLIST_FILE: true
schemes:
  AISEEBIN:
    build:
      targets:
        AISEEBIN: all
        AISEEBINTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AISEEBINTests
  NUSOpenHouse:
    build:
      targets:
        NUSOpenHouse: all
    run:
      config: Debug
