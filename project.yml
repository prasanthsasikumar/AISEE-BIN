# XcodeGen spec for AISEE-BIN. Regenerate the .xcodeproj with:  xcodegen generate
name: AISEE-BIN
options:
  bundleIdPrefix: com.flowsxr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3U4384584Z
targets:
  AISEEBIN:
    type: application
    platform: iOS
    sources:
      - path: AISEEBIN
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowsxr.aiseebin
        INFOPLIST_FILE: AISEEBIN/Info.plist
        SUPPORTS_MACCATALYST: false
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Must live on the target: a project-level value loses to Xcode's target default of 1,2,
        # and an iPad-capable app is rejected (90474) for being portrait-only.
        TARGETED_DEVICE_FAMILY: "1"
  AISEEBINTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AISEEBINTests
    dependencies:
      - target: AISEEBIN
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowsxr.aiseebin.tests
        GENERATE_INFOPLIST_FILE: true
schemes:
  AISEEBIN:
    build:
      targets:
        AISEEBIN: all
        AISEEBINTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AISEEBINTests
